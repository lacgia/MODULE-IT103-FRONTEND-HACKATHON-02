<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <header></header>



    <div class="container shadow pd-3">
        <h1>Quản lý sự kiện</h1>
        <form class="form_1">
            <div class="Event_name">
                <label class="head_input" for="name_Event">Tên sự kiện:</label><br>
                <input type="text" id="name_Event">
                <p class="d-none" id="check_botrong">Không được bỏ trống</p>
            </div>

            <div class="Event_date">
                <label class="head_input" for="name_date">Ngày tổ chức:</label><br>
                <input type="date" id="name_date">
                <p class="d-none" id="check_date">vui lòng chọn ngày</p>
            </div>

            <div class="Event_name">
                <label class="head_input" for="name_address">Địa điểm:</label><br>
                <input type="text" id="name_address">
                <p class="d-none" id="check_address">Không được bỏ trống</p>
            </div>

            <div class="Event_lord">
                <label class="head_input" for="name_lord">Người tổ chức:</label><br>
                <input type="text" id="name_lord">
                <p class="d-none" id="check_lord">Không được bỏ trống</p>
            </div>
        </form>
        <button type="button" onclick="add_Event()">thêm sự kiện</button>
    </div>



    <div class="Edit_form shadow">
        <div class="search_Name">
            <input class="input_search" oninput="search_NameEvent()" type="text" id="search_Name"
                placeholder="tìm kiếm theo tên sự kiện">
        </div>

        <table border="1" id="table">
            <thead>
                <tr>
                    <th>Tên sự kiện</th>
                    <th>Ngày</th>
                    <th>Địa điểm</th>
                    <th>Người tổ chức</th>
                    <th>Hành động</th>
                </tr>
            </thead>

            <tbody id="tbody">


            </tbody>


        </table>


        <footer></footer>
    </div>







    <script src="main.js"></script>
</body>

</html>
